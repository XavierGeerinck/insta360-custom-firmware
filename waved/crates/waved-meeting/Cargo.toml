[package]
name = "waved-meeting"
version.workspace = true
edition.workspace = true

[features]
simulate = []
recording-integrity-test-hooks = []

[dependencies]
waved-state = { path = "../waved-state" }
waved-config = { path = "../waved-config" }
waved-audio = { path = "../waved-audio" }
tokio = { workspace = true, features = ["sync", "time", "fs", "io-util"] }
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
    "stream",
] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
hound = "3"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
nix.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "fs"] }
uuid = { workspace = true, features = ["v4"] }
