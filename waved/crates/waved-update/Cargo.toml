[package]
name = "waved-update"
version.workspace = true
edition.workspace = true

[[bin]]
name = "waved-pack"
path = "src/bin/waved-pack.rs"

[dependencies]
waved-state = { path = "../waved-state" }
ed25519-dalek = "2"
sha2 = "0.10"
flate2 = "1"
hex = "0.4"
getrandom = "0.2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
nix.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
