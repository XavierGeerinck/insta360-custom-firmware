[package]
name = "waved-ui"
version.workspace = true
edition.workspace = true

[lib]
doctest = false  # bindgen-generated bindings contain C doc comments that aren't valid Rust doctests

[features]
simulate = []

[dependencies]
tokio = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
libc = "0.2"
waved-state = { path = "../waved-state" }
waved-config = { path = "../waved-config" }
waved-system = { path = "../waved-system" }
uuid.workspace = true

[build-dependencies]
cc = "1"
bindgen = "0.71"

[dev-dependencies]
png = "0.17"
