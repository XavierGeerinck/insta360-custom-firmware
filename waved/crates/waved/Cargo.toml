[package]
name = "waved"
version.workspace = true
edition.workspace = true

[[bin]]
name = "waved"
path = "src/main.rs"

[features]
simulate = [
    "waved-uart/simulate",
    "waved-bt/simulate",
    "waved-hid/simulate",
    "waved-audio/simulate",
    "waved-mcu/simulate",
    "waved-wifi/simulate",
    "waved-meeting/simulate",
]

[dependencies]
waved-state = { path = "../waved-state" }
waved-config = { path = "../waved-config" }
waved-uart = { path = "../waved-uart" }
waved-mcu = { path = "../waved-mcu" }
waved-bt = { path = "../waved-bt" }
waved-hid = { path = "../waved-hid" }
waved-audio = { path = "../waved-audio" }
waved-meeting = { path = "../waved-meeting" }
waved-wifi = { path = "../waved-wifi" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
nix.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
uuid.workspace = true
