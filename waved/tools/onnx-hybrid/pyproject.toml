[project]
name = "wave-onnx-hybrid"
version = "0.1.0"
description = "Fail-closed ONNX audit and CPU fallback PoC for the Insta360 Wave"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "onnx==1.22.0",
  "onnxruntime==1.27.0",
  "pystoi>=0.4,<0.5",
  "scipy>=1.16,<2",
  "soundfile>=0.13,<0.14",
]

[project.scripts]
wave-onnx-hybrid = "wave_onnx_hybrid.cli:main"
wave-erf-mask = "wave_onnx_hybrid.erf_mask_cli:main"
wave-erf-affine = "wave_onnx_hybrid.erf_affine_cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wave_onnx_hybrid"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
