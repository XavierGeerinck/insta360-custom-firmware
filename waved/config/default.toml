[device]
name = "Wave Open"
language = "en"

[audio]
mode = "omni"
speaker_volume = 150
mic_volume = 200
# Recording capture quality: "standard" (16-bit WAV) or "hd" (24-bit WAV).
# Same 48 kHz mono source; "hd" keeps more dynamic range at ~1.5x file size.
recording_quality = "standard"

[api]
endpoint = "https://localhost:8080/meetings/upload"
auth_token = ""
retry_max = 5
retry_backoff_ms = 1000

[security]
device_password = ""
ota_server = ""

[ntp]
servers = ["pool.ntp.org", "time.google.com"]
