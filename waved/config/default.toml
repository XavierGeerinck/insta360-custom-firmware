config_version = 2

[device]
name = "Wave Open"
language = "en"
first_run_done = false
mic_height = "medium"

[audio]
mode = "omni"
speaker_volume = 100
mic_volume = 200
nr_level = "off"
beam_aim_deg = 0.0

[display]
brightness_pct = 80
dim_after_s = 120
off_after_s = 600

[time]
zone = "UTC"
clock_24h = true

[recording]
pre_recording = false
ask_timeout_s = 60

[tones]
enabled = true

[api]
endpoint = ""
auth_token = ""
upload_mode = "automatic"
allow_insecure_http = false
retry_max = 5
retry_backoff_ms = 1000
retry_max_backoff_ms = 60000

[storage]
prune_uploaded_at_percent = 85
minimum_free_mb = 2048

[security]
device_password = ""
ota_server = ""
ota_allow_downgrade = false

[ntp]
servers = ["pool.ntp.org", "time.google.com"]

[bluetooth]
enabled = true
