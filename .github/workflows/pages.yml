name: Site

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - waved/docs/**
      - waved/crates/waved-ui/golden/**
      - site/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - waved/docs/**
      - waved/crates/waved-ui/golden/**
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Superseded PR builds can go; a Pages deployment must never be cut off midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Development happens in a private repository that also has this file;
    # only the public one builds and deploys the site.
    if: github.repository == 'XavierGeerinck/insta360-custom-firmware'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    # Only main publishes; a manual run from another branch builds but never deploys.
    if: github.repository == 'XavierGeerinck/insta360-custom-firmware' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
